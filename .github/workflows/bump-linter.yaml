# The abap2UI5 linter judges the classes the designer generates
# (npm run check:abap), and package.json pins it exactly. That pin sat at
# 0.8.5 while the linter published 0.9.0 - whose html-content-not-markup
# rejected a class the kitchen sink generated, which nothing here noticed
# until somebody moved the pin by hand.
#
# So the same weekly move the playground and the samples repositories run
# (their bump-linter.yaml is the model): resolve `latest`, pin it exactly,
# run all four checks as the gate, open a PR. A linter release that rejects
# what the designer writes fails HERE, in the bump PR, not on main.
name: bump-linter

on:
  schedule:
    - cron: '11 7 * * 1'   # Mondays 07:11 UTC - after the playground's 06:52
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # To start test.yaml on the PR's branch (below).
  actions: write

jobs:
  bump-linter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    # No write token left in .git/config while npm installs a freshly
    # published package and runs the tests over it; create-pull-request
    # authenticates on its own.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'

    - name: Pin @abap2ui5/linter to the latest published version
      id: pin
      run: |
        set -euo pipefail
        # Resolved first and checked, because `npm view` prints nothing and
        # still exits 0 when a package has no `latest` dist-tag - installing
        # `@abap2ui5/linter@` would then resolve to whatever npm felt like.
        VERSION=$(npm view @abap2ui5/linter version)
        [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        # --save-exact: every dependency here is pinned exactly.
        npm install --save-dev --save-exact "@abap2ui5/linter@$VERSION"
        if git diff --quiet package.json package-lock.json; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

    # The gate: the four checks of `npm run verify`, the browser tests on
    # the UI5 trees from npm as in test.yaml.
    - if: steps.pin.outputs.changed == 'true'
      run: npm test
    - if: steps.pin.outputs.changed == 'true'
      run: npm run check:abap
    - if: steps.pin.outputs.changed == 'true'
      run: npm run verify:abap
    - if: steps.pin.outputs.changed == 'true'
      run: npx playwright install --with-deps chromium
    - if: steps.pin.outputs.changed == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .ui5
        key: ui5-trees-1.144.0-1.71.80
    - if: steps.pin.outputs.changed == 'true'
      run: npm run ui5:trees
    - if: steps.pin.outputs.changed == 'true'
      run: npm run test:e2e:local

    - if: steps.pin.outputs.changed == 'true'
      id: pr
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        branch: bump-linter
        add-paths: |
          package.json
          package-lock.json
        title: 'chore: bump @abap2ui5/linter'
        commit-message: 'chore: bump @abap2ui5/linter to ${{ steps.pin.outputs.version }}'
        body: |
          Weekly move of `@abap2ui5/linter` to the latest version on npm
          (${{ steps.pin.outputs.version }}). The unit tests, the linter over
          the generated classes, the run on abap2UI5 and the browser tests
          ran green in the workflow that opened this PR.

    # A push or a PR made with the workflow's own GITHUB_TOKEN starts no
    # workflow runs - GitHub's rule against loops - so test.yaml would never
    # run on this PR. workflow_dispatch is exempt.
    - if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
      run: gh workflow run test.yaml --ref bump-linter
      env:
        GH_TOKEN: ${{ github.token }}
