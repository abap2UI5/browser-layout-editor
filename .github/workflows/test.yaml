name: test

on:
  push:
    branches: [main]
  pull_request:
  # bump-linter.yaml and bump-runtime.yaml start this on their PR's branch:
  # a PR opened with the workflow token starts no run by itself
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generator:
    name: generator, abap2UI5 linter, abap2UI5 runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # the catalogue against UI5 1.71, the class format, the chain against
      # a model of the view builder
      - run: npm test
      # every control, property and icon against 1.71, the house layout
      - run: npm run check:abap
      # transpiled against abap2UI5, run on it: the view, the model and
      # every event as the designer shows them
      - run: npm run verify:abap

  browser:
    name: designer in the browser (UI5 current and 1.71)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # the UI5 releases from npm, cached: the run does not depend on the CDN
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ui5
          key: ui5-trees-1.144.0-1.71.80
      - run: npm run ui5:trees
      - run: npm run test:e2e:local
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
