<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>abap2UI5 Layout Editor</title>
  <meta name="description" content="Lay out a UI5 view by drag and drop and get the abap2UI5 class that builds it - one ABAP class to pull with abapGit and build on.">
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="appbar">
    <!-- The bar every abap2UI5 tool wears (the Playground, the AI App Builder
         and the AI Agent in abap2UI5/browser-playground), in the same order:
         the mark and "abap2UI5" go home, the tool's name in the accent is the
         menu of all four tools (filled from TOOLS in src/family.js, the
         playground's src/shell/family.mjs byte for byte), undo and redo
         beside it; at the right end Export, Full screen and the appearance
         switch, the last control of the bar. -->
    <div class="brand-row">
      <a class="brand" href="https://abap2ui5.github.io/" title="To abap2UI5's home page">
        <img class="mark" src="logo.png" alt="" width="20" height="20">
        <span class="word">abap2UI5</span>
      </a>
      <div class="menu-wrap tool-switch">
        <button id="btnTools" class="tool-switch-name" aria-haspopup="menu" aria-expanded="false" title="The abap2UI5 tools - switch to another one">Layout Editor</button>
        <nav id="toolMenu" class="menu tool-menu" aria-label="abap2UI5 tools" hidden></nav>
      </div>
      <div class="history">
        <button id="btnUndo" class="ghost icon" title="Undo (Ctrl+Z)" aria-label="Undo">↶</button>
        <button id="btnRedo" class="ghost icon" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">↷</button>
      </div>
    </div>
    <div class="classfield">
      <label for="className">Class</label>
      <input id="className" spellcheck="false" autocomplete="off" maxlength="30">
      <input id="description" placeholder="Description" maxlength="60" autocomplete="off" aria-label="Description">
      <!-- the options are RELEASES of src/family.js, the same four in every
           tool that writes code -->
      <select id="abapRelease" aria-label="ABAP release" title="Your SAP system - the ABAP release the class is written for"></select>
    </div>
    <!-- The status every abap2UI5 tool's bar carries in one place: right
         after the tool's main controls, one muted line - what was last
         done (everything a toast says lands here too) and the problems. -->
    <div class="bar-status" id="barStatus">
      <span id="statusText" role="status" aria-live="polite"></span>
      <button id="statusProblems" class="link" hidden title="Open the problems"></button>
    </div>
    <div class="bar-actions">
      <button id="btnCmd" class="ghost cmd" title="Command palette (Ctrl+K)" aria-label="Command palette"><svg class="cmd-icon" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10.4 10.4 14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span class="cmd-text">Search or insert…</span><kbd>Ctrl K</kbd></button>
      <div class="menu-wrap">
        <button id="btnFile" class="ghost" aria-haspopup="menu" aria-expanded="false">File ▾</button>
        <div id="fileMenu" class="menu" role="menu" hidden>
          <button id="btnNew" role="menuitem">New from template…</button>
          <button id="btnOpen" role="menuitem">Open design (.json)…</button>
          <button id="btnSave" role="menuitem">Save design (.json)</button>
          <button id="btnSaveBrowser" role="menuitem" title="Keep the design in this browser, under its class name (Ctrl+S)">Save as draft <kbd>Ctrl S</kbd></button>
          <button id="btnOpenClass" role="menuitem" title="An abap2UI5 app class - its view, data and events become the design, the rest of the class is kept">Open ABAP class…</button>
          <button id="btnImport" role="menuitem">Import UI5 XML view…</button>
          <button id="btnRecent" role="menuitem" title="The drafts kept in this browser, and the designs New, Open or Import replaced">Drafts…</button>
          <hr class="menu-rule">
          <button id="btnHelp" role="menuitem" title="What the editor does, and its keyboard shortcuts">Help <kbd>?</kbd></button>
        </div>
      </div>
      <!-- The Export menu every abap2UI5 tool carries: the entries of
           EXPORT_ENTRIES in src/family.js, in that order, then the editor's
           own. The "Open in" list is filled from TOOLS. -->
      <div class="menu-wrap">
        <button id="btnExport" class="ghost" aria-haspopup="menu" aria-expanded="false" title="The class out of the editor: abapGit, the clipboard, a link, another tool">Export ▾</button>
        <div id="exportMenu" class="menu right" role="menu" hidden>
          <button id="btnZip" role="menuitem" title="The class with its abapGit files - abapGit: New Offline, Import ZIP">Download for abapGit (.zip)</button>
          <button id="btnCopy" role="menuitem">Copy ABAP</button>
          <button id="btnShare" role="menuitem" title="A link that carries the design">Copy share link</button>
          <hr class="menu-rule">
          <span class="menu-head" id="openInHead">Open in</span>
          <div id="openInList" class="menu-group" role="group" aria-labelledby="openInHead"></div>
          <button id="btnVscode" role="menuitem" title="Open the class in VS Code with the abap2UI5 extension">VS Code</button>
          <hr class="menu-rule">
          <button id="btnDownloadAbap" role="menuitem">Download ABAP (.clas.abap)</button>
          <button id="btnCopyXml" role="menuitem">Copy XML view</button>
        </div>
      </div>
      <button id="btnFullscreen" class="ghost icon" title="Full screen" aria-label="Full screen" aria-pressed="false">⛶</button>
      <button id="btnTheme" class="ghost icon" title="Appearance" aria-label="Appearance">◐</button>
    </div>
  </header>

  <!-- Below 820px one pane at a time, as the other abap2UI5 tools do on a
       phone: the same pills as their Chat / App / Code. -->
  <nav class="seg phone-tabs" id="phoneTabs" role="tablist" aria-label="Pane">
    <button role="tab" data-pane="drawer" aria-selected="false">Controls</button>
    <button role="tab" data-pane="canvas" aria-selected="true" class="active">Design</button>
    <button role="tab" data-pane="code" aria-selected="false">Code</button>
    <button role="tab" data-pane="inspector" aria-selected="false">Properties</button>
  </nav>

  <main class="workspace" id="workspace" data-pane="canvas">
    <aside class="drawer" id="drawer">
      <nav class="rail" role="tablist" aria-label="Panels">
        <button class="rail-btn active" data-panel="insert" role="tab" title="Controls and building blocks to drag onto the canvas">Controls</button>
        <button class="rail-btn" data-panel="layers" role="tab" title="The structure of the view">Outline</button>
        <button class="rail-btn" data-panel="data" role="tab" title="Attributes and tables of the class">Data</button>
        <button class="rail-btn" data-panel="issues" role="tab" title="What would break the class or the view">Problems <span id="issueCount" class="dot hidden"></span></button>
      </nav>
      <section class="panel" id="panel-insert" role="tabpanel">
        <div class="panel-head">
          <input id="insertSearch" type="search" placeholder="Search controls" aria-label="Search controls">
        </div>
        <div class="insert-target" id="insertTarget"></div>
        <div id="insertList" class="scroll"></div>
      </section>
      <section class="panel hidden" id="panel-layers" role="tabpanel">
        <div class="panel-head">
          <input id="layersFilter" type="search" placeholder="Filter the outline" aria-label="Filter the outline">
        </div>
        <div id="layers" class="scroll tree" role="tree" aria-label="Outline" aria-multiselectable="true"></div>
      </section>
      <section class="panel hidden" id="panel-data" role="tabpanel">
        <div id="dataPanel" class="scroll pad"></div>
      </section>
      <section class="panel hidden" id="panel-issues" role="tabpanel">
        <div id="issuesPanel" class="scroll pad"></div>
      </section>
    </aside>
    <div class="resizer" id="resizeDrawer" title="Drag to resize, double-click to reset" aria-hidden="true"></div>

    <section class="stage">
      <div class="stage-bar">
        <div class="seg" role="group" aria-label="Editor">
          <button data-view="canvas" title="The design only">Design</button>
          <button data-view="split" class="active" title="The design and the class side by side">Split</button>
          <button data-view="code" title="The class only">Code</button>
        </div>
        <div class="seg" role="group" aria-label="Mode">
          <button data-mode="design" class="active" title="A click selects, a drag drops">Edit</button>
          <button data-mode="interact" title="Use the view as a user would">Try</button>
        </div>
        <span class="spacer"></span>
        <div class="seg" role="group" aria-label="Device" id="device">
          <button data-device="100%" title="Desktop">Desktop</button>
          <button data-device="820px" title="Tablet">Tablet</button>
          <button data-device="390px" title="Phone">Phone</button>
        </div>
        <select id="zoom" aria-label="Zoom of the canvas" title="Zoom of the canvas - a large view at a glance">
          <option value="1">100%</option>
          <option value="0.75">75%</option>
          <option value="0.5">50%</option>
        </select>
        <select id="theme" aria-label="Theme of the canvas" title="The UI5 theme of the canvas - Auto follows the editor's appearance">
          <option value="auto">Auto (as the editor)</option>
          <option value="sap_horizon">Horizon</option>
          <option value="sap_horizon_dark">Horizon Dark</option>
          <option value="sap_fiori_3">Quartz Light</option>
          <option value="sap_fiori_3_dark">Quartz Dark</option>
          <option value="sap_belize">Belize</option>
        </select>
        <label class="ui5-label" for="ui5version">UI5 preview</label>
        <!-- the releases are UI5_RELEASES of src/family.js, the playground's
             UI5 check offers the same ones; filled by src/ui/ui5field.js -->
        <input id="ui5version" list="ui5versions" placeholder="latest" title="UI5 of the preview: a version, e.g. 1.71.80, or the URL of a UI5 of your own (the folder with resources/) - empty: the latest from the OpenUI5 CDN" size="9" spellcheck="false" autocomplete="off">
        <datalist id="ui5versions"></datalist>
      </div>
      <div class="stage-body view-split" id="stageBody">
        <div class="canvas-pane" id="canvasPane">
          <div id="previewStatus" class="preview-status hidden" role="status" aria-live="polite"></div>
          <div class="device-frame" id="deviceFrame">
            <!-- sandboxed: a design's markup (core:HTML) runs in an opaque
                 origin, never on the origin the four tools share - the
                 parent and the canvas talk by postMessage only -->
            <iframe id="preview" title="Preview" sandbox="allow-scripts"></iframe>
            <!-- over the canvas while a control is dragged: the browser
                 drops nothing into another origin's frame, so the editor
                 takes the drop and hands the canvas its point (src/ui/preview.js) -->
            <div id="dropShield" class="drop-shield" hidden></div>
          </div>
          <div id="eventLog" class="event-log hidden" aria-live="polite" aria-label="Events of the preview"></div>
          <!-- the first visit's hint strip (src/ui/first-steps.js) -->
          <div id="firstSteps" class="first-steps-anchor" hidden></div>
        </div>
        <div class="code-pane" id="codePane">
          <div class="code-head">
            <div class="seg small" role="group" aria-label="Code">
              <button data-code="abap" class="active">ABAP class</button>
              <button data-code="xml">XML view</button>
              <button data-code="diff" id="btnDiff" hidden title="What the export changes in the class as it was opened">Changes</button>
            </div>
            <span id="codeInfo" class="muted"></span>
            <button id="btnCopyCode" class="ghost small" title="Copy what this tab shows">Copy</button>
          </div>
          <pre id="code" class="codeblock" tabindex="0" aria-label="Generated code"></pre>
        </div>
      </div>
      <nav class="crumbs" id="crumbs" aria-label="Selection path"></nav>
    </section>

    <div class="resizer" id="resizeInspector" title="Drag to resize, double-click to reset" aria-hidden="true"></div>
    <aside class="inspector" id="inspector" aria-label="Properties"></aside>
  </main>

  <dialog id="dlg" class="dialog"></dialog>
  <dialog id="cmdk" class="cmdk" aria-label="Command palette">
    <input id="cmdkInput" placeholder="Insert a control, jump to one, or run a command…" autocomplete="off" spellcheck="false">
    <div id="cmdkList" class="cmdk-list" role="listbox"></div>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input id="fileInput" type="file" accept=".json,.xml,.abap,application/json,text/xml,text/plain" hidden>

  <script type="module" src="src/app.js"></script>
</body>
</html>
